name: ${PROJECT_NAME}-${CLIENT_ID}-${APP_BUILD_ENV}

networks:
  app_net:
    name: ${PROJECT_NAME}-${CLIENT_ID}
    driver: bridge

services:
  app:
    env_file:
      - .env
    build:
      context: .
      target: ${APP_BUILD_ENV}
      args:
        - APP_BASE_IMG=${APP_BASE_IMG}
        - APP_DIR=${APP_DIR}
        - APP_RUNTIME_GROUP=${APP_RUNTIME_GROUP}
        - APP_RUNTIME_USER=${APP_RUNTIME_USER}
        - BUILD_DATE=${BUILD_DATE}
        - LICENSE=${LICENSE}
        - PHP_FPM_PORT=${PHP_FPM_PORT}
        - PROJECT_AUTHORS=${PROJECT_AUTHORS}
        - PROJECT_DESCRIPTION=${PROJECT_DESCRIPTION}
        - PROJECT_LABEL=${PROJECT_LABEL}
        - REVISION=${REVISION}
        - TAG_IMAGE=${TAG_IMAGE:-latest}
        - TZ=${TZ}
        - VENDOR_LABEL=${VENDOR_LABEL:-Contoso}
    image: ${VENDOR_ID}/${PROJECT_NAME}-${CLIENT_ID}:${TAG_IMAGE:-latest}
    container_name: ${PROJECT_NAME}-${CLIENT_ID}-app-${APP_SERVICE}-${APP_BUILD_ENV}
    hostname: app-${APP_SERVICE}-${APP_BUILD_ENV}
    restart: always
    networks:
      - app_net
    environment:
      - APP_DIR=${APP_DIR}
      - APP_SERVICE=${APP_SERVICE}
      - APP_RUNTIME_USER=${APP_RUNTIME_USER}
      - APP_RUNTIME_GROUP=${APP_RUNTIME_GROUP}
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - APP_KEY=${APP_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    expose:
      - "${PHP_FPM_PORT}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$socket=@fsockopen("127.0.0.1", ${PHP_FPM_PORT});
          exit($$socket ? 0 : 1);'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      target: web-${APP_BUILD_ENV}
      args:
        - APP_DIR=${APP_DIR}
        - BUILD_DATE=${BUILD_DATE}
        - LICENSE=${LICENSE}
        - PROJECT_AUTHORS=${PROJECT_AUTHORS}
        - PROJECT_DESCRIPTION=${PROJECT_DESCRIPTION}
        - PROJECT_LABEL=${PROJECT_LABEL}
        - REVISION=${REVISION}
        - TAG_IMAGE=${TAG_IMAGE:-latest}
        - VENDOR_LABEL=${VENDOR_LABEL:-Contoso}
        - WEBSERVER_BASE_IMG=${WEBSERVER_BASE_IMG}
        - WEBSERVER_SITE_ROOT_DIR=${WEBSERVER_SITE_ROOT_DIR}
        - WEBSERVER_PORT=${WEBSERVER_PORT}
        - WEBSERVER_PORT_SSL=${WEBSERVER_PORT_SSL}
    image: ${VENDOR_ID}/${PROJECT_NAME}-${CLIENT_ID}-web:${TAG_IMAGE:-latest}
    container_name: ${PROJECT_NAME}-${CLIENT_ID}-web-${WEBSERVER_SERVICE}-${APP_BUILD_ENV}
    hostname: web-${WEBSERVER_SERVICE}-${APP_BUILD_ENV}
    restart: always
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_net
    environment:
      - PHP_FPM_HOST=${PHP_FPM_HOST}
      - PHP_FPM_PORT=${PHP_FPM_PORT}
      - SSL_CERT_FILE=${SSL_CERT_FILE}
      - SSL_KEY_FILE=${SSL_KEY_FILE}
      - WEBSERVER_CLIENT_MAX_BODY_SIZE=${WEBSERVER_CLIENT_MAX_BODY_SIZE}
      - WEBSERVER_DOMAIN_NAME=${WEBSERVER_DOMAIN_NAME}
      - WEBSERVER_PORT=${WEBSERVER_PORT}
      - WEBSERVER_PORT_SSL=${WEBSERVER_PORT_SSL}
      - WEBSERVER_SITE_ROOT_DIR=${WEBSERVER_SITE_ROOT_DIR}
    ports:
      - "${WEBSERVER_PORT}:${WEBSERVER_PORT}"
      - "${WEBSERVER_PORT_SSL}:${WEBSERVER_PORT_SSL}"
    volumes:
      - ./data/utils/ssl:${SSL_DIR}:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:${WEBSERVER_PORT}/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
