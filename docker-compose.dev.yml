# -----------------------------------------------------------------------------
# Docker Compose override para ambiente de desenvolvimento.
# -----------------------------------------------------------------------------

volumes:
  db_vol:
    name: ${PROJECT_NAME}-${CLIENT_ID}-${DB_SERVICE}-${APP_BUILD_ENV}

services:
  app:
    env_file:
      - .env
      - .env.dev
    build:
      target: ${APP_BUILD_ENV}
    restart: no
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:${APP_DIR}:rw

  web:
    restart: no
    volumes:
      - ./app/public:${WEBSERVER_SITE_ROOT_DIR}:ro
      - ./data/utils/ssl:${SSL_DIR}:ro

  db:
    env_file:
      - .env
      - .env.dev
    image: ${DB_BASE_IMG}
    container_name: ${PROJECT_NAME}-${CLIENT_ID}-db-${DB_SERVICE}-${APP_BUILD_ENV}
    hostname: db-${DB_SERVICE}-${APP_BUILD_ENV}
    restart: no
    networks:
      - app_net
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ}
    ports:
      - "${DB_PUBLISHED_PORT}:${DB_PORT}"
    volumes:
      - db_vol:${DB_DIR}:rw
      - ./data/db/dumps:${DB_DUMPS_DIR}:rw
    command: --port=${DB_PORT}
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --innodb_file_per_table=1
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "${DB_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
